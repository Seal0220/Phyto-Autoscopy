[project]
name = "phyto-autoscopy"
version = "0.1.0"
description = "API-only FastAPI hardware backend for the CHLOROCULUS control system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets",
  "opencv-contrib-python>=4.12,<5",
  "cv2-enumerate-cameras>=1.3.3,<2",
  "numpy",
  "scipy",
  "pandas",
  "aiofiles",
  "Phidget22",
  "pydantic",
  "sqlalchemy",
  "torch>=2.1",
  "gsplat>=1.5,<2",
  "pycolmap>=3.13,<4",
  "open3d>=0.19,<1",
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
